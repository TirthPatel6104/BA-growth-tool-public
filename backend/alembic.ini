# Alembic configuration for the Basal Area Growth Tool backend.
#
# The database URL is NOT stored here – alembic/env.py resolves it from the
# environment exactly like the application does (DATABASE_URL, BAGT_SQL_*,
# or the default SQLite demo file).  See db/config.py.
#
#   cd backend
#   alembic upgrade head                 # create / upgrade the schema
#   alembic revision --autogenerate -m "describe change"
#   alembic stamp head                   # adopt an existing (pre-Alembic) MSSQL database

[alembic]
script_location = %(here)s/alembic
prepend_sys_path = .
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s
timezone = UTC
truncate_slug_length = 40
path_separator = os

# Logging (used only when running the alembic CLI; the app configures its own logging)
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
