[pytest]
; ---------------------------------------------------------------------------
; Basal Area Growth Tool – pytest configuration
; ---------------------------------------------------------------------------
testpaths = tests

; Verbose output by default
addopts =
    -v
    --tb=short
    --cov=backend
    --cov-report=term-missing
    --cov-report=html:coverage_html
    --cov-report=xml:coverage.xml

; Markers
markers =
    unit:        Pure unit tests – no database required
    integration: Tests that require a live SQL Server connection
    slow:        Long-running tests

; Treat these warnings as errors
filterwarnings =
    error::DeprecationWarning
    ignore::UserWarning
